# Ranking de Administración en «Todas» (spec 024). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición: aprendices con puntos en la Escuela y en el Diplomado. Cada formación compara solo a los suyos: el primero de cada una es el 1.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "COMUNIDAD"
- extendedWaitUntil:
    visible: "Todas"
    timeout: 30000
- tapOn: "Todas"
- tapOn: "Ranking"
# Una sección por formación, cada una con su tabla.
- extendedWaitUntil:
    visible: "Escuela Renaser"
    timeout: 30000
- assertVisible: "Diplomado Renaser"
- takeScreenshot: C04a-ranking-por-formacion
# Elegir una sola formación deja la tabla de siempre, sin encabezados por formación.
- tapOn: "Diplomado"
- extendedWaitUntil:
    visible: "Tu posición"
    timeout: 30000
- assertNotVisible: "Escuela Renaser"
- takeScreenshot: C04b-ranking-del-diplomado
