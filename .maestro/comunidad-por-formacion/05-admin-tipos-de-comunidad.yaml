# Administración → Formaciones → Comunidad: prender y apagar los tipos (spec 024). ESCRITO Y SIN CORRER.
# cuenta: admin  (Administración o Alquimista)
# Precondición: el Diplomado tiene chats directos creados. Apagar «Directos» los esconde para toda la formación sin borrar mensajes.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Administración"
    direction: DOWN
    timeout: 40000
- tapOn: "Administración"
- scrollUntilVisible:
    element: "Formaciones"
    direction: DOWN
    timeout: 40000
- tapOn: "Formaciones"
- tapOn: "Diplomado Renaser.*"
# Maestro no distingue mayúsculas: «Comunidad» a secas ya está a la vista en la barra de pestañas (COMUNIDAD) y no baja; se baja hasta el primer tipo.
- scrollUntilVisible:
    element: "Comunidad general"
    direction: DOWN
    timeout: 40000
- assertVisible: "Comunidad general"
- assertVisible: "Grupo con mentor"
- assertVisible: "Soporte"
- assertVisible: "Directos"
- takeScreenshot: C05a-tipos-de-comunidad
# Apagar pide confirmación y dice cuántas conversaciones esconde.
- tapOn: "Directos"
- extendedWaitUntil:
    visible: "¿Apagar «Directos»?"
    timeout: 20000
- assertVisible: ".*Los mensajes no se borran.*"
- takeScreenshot: C05b-confirmar-apagar
- tapOn: "Cancelar"
# Prender o confirmar guarda y lo dice en una línea.
- tapOn: "Directos"
- tapOn: "Apagar"
# La línea «… apagado.» / «… prendido.» dura ~3 s y el dev client tarda ~10 s por toque: no se espera como obligatoria.
- extendedWaitUntil:
    visible: "«Directos» apagado."
    timeout: 20000
    optional: true
- takeScreenshot: C05c-directos-apagado
# Se vuelve a prender (el estado queda como estaba para el siguiente flujo).
- tapOn: "Directos"
- extendedWaitUntil:
    visible: "«Directos» prendido."
    timeout: 20000
    optional: true
