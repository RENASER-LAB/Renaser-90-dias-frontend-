# La ficha de la persona dice cómo entró, igual que la lista de «Aceptadas» (spec 025, historia 4, escenario 1). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición: «Sol-Diplomado Uno» ya aceptada en el Diplomado de 1 año, con diagnóstico (flujo 02), con un rol base (o uno personalizado).
appId: com.renaser.app
---
- runFlow: comun-abrir-solicitudes.yaml
- tapOn: "Aceptadas"
# La lista de aceptadas sigue el orden de las solicitudes: se baja hasta la de «Sol-Diplomado Uno».
- scrollUntilVisible:
    element: "Sol-Diplomado Uno"
    direction: DOWN
    timeout: 60000
# Lo que dice la lista...
- assertVisible: "Aceptada por .*"
- assertVisible: "Diplomado 1 año.*con diagnóstico"
- takeScreenshot: S06a-la-lista
# ...lo dice la ficha (Administración → Personas → la persona).
- back
# Personas lista a todos (más de cien en la base de prueba): se busca a la persona, y la ficha es larga.
- scrollUntilVisible:
    element: "Personas.*"
    direction: DOWN
    timeout: 60000
- tapOn: "Personas.*"
- tapOn: "Buscar por nombre o correo"
- inputText: "Diplomado"
- extendedWaitUntil:
    visible: "Sol-Diplomado Uno"
    timeout: 30000
- tapOn: "Sol-Diplomado Uno"
- scrollUntilVisible:
    element: "Cómo entró"
    direction: DOWN
    timeout: 40000
- assertVisible: "Aceptada por .*"
- assertVisible: "Diplomado 1 año.*con diagnóstico"
- takeScreenshot: S06b-la-ficha
