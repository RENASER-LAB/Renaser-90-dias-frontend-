# Aceptar a un aprendiz de la Escuela, sin diagnóstico: viene todo marcado (menos cómo paga, spec 032), así que son DOS toques más el del pago (spec 025, 025-4 B). ESCRITO Y SIN CORRER.
# cuenta: admin  (Administración o Alquimista)
# Precondición (base local, nunca producción): una solicitud PENDIENTE de «Sol-Escuela Uno»; la Escuela tiene una recepción abierta.
# Se corre con: .maestro/correr.sh .maestro/solicitud-con-formacion/01-aceptar-aprendiz-de-la-escuela-en-dos-toques.yaml
appId: com.renaser.app
---
- runFlow: comun-abrir-solicitudes.yaml
- extendedWaitUntil:
    visible: "Seleccionar varias"
    timeout: 30000
- takeScreenshot: S01a-por-decidir
# Con 19 solicitudes por decidir, el «Aceptar» de esta queda abajo de lo que se ve al abrir: se baja hasta él.
- scrollUntilVisible:
    element: "Aceptar a Sol-Escuela Uno"
    direction: DOWN
    timeout: 40000
- tapOn: "Aceptar a Sol-Escuela Uno"
# La hoja abre con todo marcado (menos el pago, spec 032) y la frase del resumen.
- extendedWaitUntil:
    visible: "Aceptar solicitud"
    timeout: 15000
# Spec 032: el aprendiz elige cómo paga (no viene marcado). Estos flujos lo aceptan como «pagó completo».
- tapOn: "Pago"
- tapOn: "Sin cronograma \\(pagó completo\\)"
- assertVisible: "Sol-Escuela Uno entrará a la Escuela Renaser como Aprendiz, sin diagnóstico y pagó completo."
- assertVisible: "Formación"
- assertVisible: "Rol"
- assertVisible: "Ficha de entrada"
- takeScreenshot: S01b-la-hoja-con-todo-marcado
# Hay un solo «Aceptar»: el del pie fijo de la hoja (con `index: 1` no hay segundo y el toque falla).
- tapOn: "Aceptar"
# Se acepta, la hoja se cierra y la solicitud sale de «Por decidir».
- extendedWaitUntil:
    visible: "Sol-Escuela Uno entró a la Escuela Renaser como Aprendiz.*"
    timeout: 20000
- assertNotVisible: "Aceptar a Sol-Escuela Uno"
- takeScreenshot: S01c-aceptada
# En «Aceptadas» dice quién y qué se eligió.
- scrollUntilVisible:
    element: "Aceptadas"
    direction: UP
    timeout: 40000
- tapOn: "Aceptadas"
# La lista de aceptadas (65) sigue el orden de las solicitudes, no el de la decisión: se baja hasta la de esta corrida.
- scrollUntilVisible:
    element: "Sol-Escuela Uno"
    direction: DOWN
    timeout: 60000
- assertVisible: "Aceptada por.*"
- assertVisible: "Escuela · Aprendiz · sin diagnóstico"
- takeScreenshot: S01d-en-aceptadas
