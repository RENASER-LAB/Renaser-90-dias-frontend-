# Cambiar la duración del programa de un aprendiz del Diplomado que ya empezó: conserva su día (spec 025, 025-2 A). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición: «Dip-Empezó Uno», aprendiz del Diplomado de 3 meses con su Día 1 elegido y en curso (no terminó). Sale en Administración → Personas.
# Datos (02/11/2026): esa cuenta NO existe en la base local renaser_e2e_final; hay que sembrarla (usuario, participante del Diplomado de 3 meses y su Día 1) antes de correr este flujo.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Administración"
    direction: DOWN
    timeout: 40000
- tapOn: "Administración"
- scrollUntilVisible:
    element: "Personas.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Personas.*"
- tapOn: "Buscar por nombre o correo"
- inputText: "Dip-Emp"
- extendedWaitUntil:
    visible: "Dip-Empezó Uno.*"
    timeout: 30000
- tapOn: "Dip-Empezó Uno.*"
- scrollUntilVisible:
    element: "Cambiar la duración"
    direction: DOWN
    timeout: 40000
- tapOn: "Cambiar la duración"
- extendedWaitUntil:
    visible: "Nueva duración"
    timeout: 20000
- assertVisible: "Hoy dura 3 meses. Seguirá en el mismo día; solo cambia cuándo termina."
- tapOn: "1 año.*"
- tapOn: "Por qué se cambia.*"
# Dos comandos de pocas letras y sin tildes (Maestro no escribe bien los caracteres que no son ASCII): `inputText` con el dev client tarda ~7 a 10 s por letra y pasa de 120 s con más de ~10 (Maestro #3667).
- inputText: "Pidio ma"
- inputText: "s tiempo"
- takeScreenshot: S05a-cambiar-la-duracion
- tapOn:
    text: "Cambiar la duración"
    index: 1
- extendedWaitUntil:
    visible: "¿Cambiar la duración?"
    timeout: 10000
    optional: true
- tapOn:
    text: "Cambiar la duración"
    optional: true
- extendedWaitUntil:
    visible: "Diplomado Renaser · 1 año"
    timeout: 30000
- takeScreenshot: S05b-un-anio
