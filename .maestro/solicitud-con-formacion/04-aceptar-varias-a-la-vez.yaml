# Seleccionar varias solicitudes y aceptarlas con una misma elección (spec 025, 025-3 C). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición: tres solicitudes PENDIENTES: «Sol-Lote Uno», «Sol-Lote Dos» y «Sol-Lote Tres».
appId: com.renaser.app
---
- runFlow: comun-abrir-solicitudes.yaml
- extendedWaitUntil:
    visible: "Sol-Lote Uno"
    timeout: 30000
- tapOn: "Seleccionar varias"
- tapOn: "Sol-Lote Uno.*"
- tapOn: "Sol-Lote Dos.*"
- tapOn: "Sol-Lote Tres.*"
- assertVisible: "Aceptar 3 solicitudes"
- takeScreenshot: S04a-tres-marcadas
- tapOn: "Aceptar 3 solicitudes"
- extendedWaitUntil:
    visible: "Aceptar 3 solicitudes"
    timeout: 15000
- assertVisible: "Las 3 personas entrarán a la Escuela Renaser como Aprendiz, sin diagnóstico."
- tapOn:
    text: "Aceptar a 3 personas"
- extendedWaitUntil:
    visible: "Las 3 personas entraron a la Escuela Renaser como Aprendiz, sin diagnóstico.*"
    timeout: 40000
- assertNotVisible: "Sol-Lote Uno"
- takeScreenshot: S04b-tres-aceptadas
