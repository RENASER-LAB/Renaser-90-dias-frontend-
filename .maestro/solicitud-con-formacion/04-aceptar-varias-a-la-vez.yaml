# Seleccionar varias solicitudes y aceptarlas con una misma elección (spec 025, 025-3 C). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición: tres solicitudes PENDIENTES: «Sol-Lote Uno», «Sol-Lote Dos» y «Sol-Lote Tres».
appId: com.renaser.app
---
- runFlow: comun-abrir-solicitudes.yaml
- extendedWaitUntil:
    visible: "Seleccionar varias"
    timeout: 30000
- tapOn: "Seleccionar varias"
# Con 19 solicitudes por decidir las tres quedan abajo de lo que se ve al abrir (van de la más nueva a la más vieja): se baja hasta cada una.
- scrollUntilVisible:
    element: "Sol-Lote Uno.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Sol-Lote Uno.*"
- scrollUntilVisible:
    element: "Sol-Lote Dos.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Sol-Lote Dos.*"
- scrollUntilVisible:
    element: "Sol-Lote Tres.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Sol-Lote Tres.*"
- assertVisible: "Aceptar 3 solicitudes"
- takeScreenshot: S04a-tres-marcadas
- tapOn: "Aceptar 3 solicitudes"
- extendedWaitUntil:
    visible: "Aceptar 3 solicitudes"
    timeout: 15000
# Spec 032: el aprendiz elige cómo paga (no viene marcado). Estos flujos lo aceptan como «pagó completo».
- tapOn: "Pago"
- tapOn: "Sin cronograma \\(pagó completo\\)"
- assertVisible: "Las 3 personas entrarán a la Escuela Renaser como Aprendiz, sin diagnóstico y pagó completo."
- tapOn:
    text: "Aceptar a 3 personas"
- extendedWaitUntil:
    visible: "Las 3 personas entraron a la Escuela Renaser como Aprendiz, sin diagnóstico.*"
    timeout: 40000
- assertNotVisible: "Sol-Lote Uno"
- takeScreenshot: S04b-tres-aceptadas
