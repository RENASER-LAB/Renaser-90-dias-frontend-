# 01 — KILÓMETROS DIARIOS (D-226): Training (lista por hora, spec 014) → su fila → («Tomar foto» si el hábito trae guía) →
# hoja «Tomar foto / Elegir de la galería» (#41) → «Tomar foto» → foto → «¿Cuántos km recorriste hoy?» → 3,5 → sale de la
# lista y queda en «N hechos hoy».
# Precondición: el aprendiz tiene el hábito en su día de hoy y sin registrar; fotos en local (fotos-local + adb reverse).
# Lo de días anteriores no importa: el flujo mide cuánto sube el total.
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
# Centrada: abajo a la derecha, la fila queda debajo del botón flotante de SER y el toque abre su chat.
- scrollUntilVisible:
    element: ".*KILÓMETROS DIARIOS.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ".*KILÓMETROS DIARIOS.*"
# Con guía cargada, la fila abre la hoja del hábito con «Tomar foto» (la etiqueta es solo esas dos palabras); sin guía,
# abre directo la hoja de origen.
- runFlow:
    when:
      visible: "Tomar foto"
    commands:
      - tapOn: "Tomar foto"
# #41: solo este hábito pregunta de dónde sale la foto (la galería es para la captura de la app de actividad). Los demás
# hábitos con foto abren la cámara directo (flujo 10). La fila se anuncia «Tomar foto. Con la cámara del teléfono».
- extendedWaitUntil:
    visible: "Elegir de la galería.*"
    timeout: 15000
- takeScreenshot: 01-kilometros-hoja-de-origen
- tapOn: "Tomar foto.*"
- runFlow: ../comun/tomar-foto.yaml
- extendedWaitUntil:
    visible: "¿Cuántos km recorriste hoy?"
    timeout: 15000
# «Total recorrido» es lo que ya registró en el programa más lo de hoy: con otro día ya registrado no es 3,5. Se lee
# antes de escribir y se exige que suba exactamente 3,5 (en el QA del 14/10 la cuenta traía 3,5 de ayer: 7 km).
- copyTextFrom:
    text: "Total recorrido: .* km"
- evalScript: ${output.totalAntes = parseFloat(maestro.copiedText.replace(/[^0-9,]/g, '').replace(',', '.')) || 0}
- tapOn: "¿Cuántos km recorriste hoy?"
- inputText: "3,5"
- hideKeyboard
- copyTextFrom:
    text: "Total recorrido: .* km"
- assertTrue:
    condition: ${Math.abs(parseFloat(maestro.copiedText.replace(/[^0-9,]/g, '').replace(',', '.')) - (output.totalAntes + 3.5)) < 0.01}
    label: "El total sube 3,5 km"
- takeScreenshot: 01a-kilometros-escritos
- tapOn: "REGISTRAR"
- runFlow: ../comun/cerrar-aviso-dev.yaml
- extendedWaitUntil:
    notVisible: "[0-9:]+, KILÓMETROS DIARIOS(, Te toca ahora|, Lo que sigue)?"
    timeout: 30000
- scrollUntilVisible:
    element: ".* hechos? hoy"
    direction: DOWN
    timeout: 30000
- tapOn: ".* hechos? hoy"
- scrollUntilVisible:
    element: ".*KILÓMETROS DIARIOS, hecho"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 01b-kilometros-cumplido
