# 20 — Administración: entrar desde Yo y volver con el atrás del sistema (gesto lateral, AGENTS.md §6).
# cuenta: admin
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Abrir Administración"
    direction: DOWN
- tapOn: "Abrir Administración"
- extendedWaitUntil:
    visible: "Operación del programa"
    timeout: 15000
- takeScreenshot: 20a-administracion
- back
# Yo vuelve arriba (sin desplazar): la fila de Administración queda más abajo, se baja hasta ella.
- scrollUntilVisible:
    element: "Abrir Administración"
    direction: DOWN
    timeout: 30000
# La barra de pestañas se esconde al desplazar (D-246): no se mira TRAINING. Basta con haber vuelto a Yo (la fila de
# Administración está a la vista) y con que la pantalla de Administración ya no esté.
- assertNotVisible: "Operación del programa"
