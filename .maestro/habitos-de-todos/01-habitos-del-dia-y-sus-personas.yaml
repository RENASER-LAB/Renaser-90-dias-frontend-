# «Hábitos de todos» (2026-10-31, spec 029, pedido del dueño: «el líder ve todos los hábitos, quién los cumplió y quién no»).
# Necesita el backend con `GET /leadership/habits` y un emulador libre.
# corrido: 2026-11-18 (con `-e HABITO=Despertar -e PERSONA=Aprendiz`).
# Spec 056 (2026-11-18): «Mis mentores» es la pantalla nueva del líder (anclas «Mentores» y «Hábitos de todos» al pie); «Resultado por grupo» ya no existe.
# El líder → Yo → «Mis mentores» → «Hábitos de todos» (un día, hoy) → un hábito → sus personas (primero las que no cumplieron)
# → la ficha de una persona, abierta en ese mismo día → atrás (personas, con la búsqueda) → atrás (hábitos del día) → atrás
# («Mis mentores»).
# cuenta: admin (la ranura E2E_ADMIN_* apunta al LÍDER DE MENTORES).
# HABITO = parte del nombre de un hábito de hoy. PERSONA = parte del nombre de una persona que lo tenía (de hasta ~9 letras: `inputText` de Maestro tarda ~10 s por letra y
# se corta a los 120 s; con «E2E Aprendiz», 12 letras, el flujo se cortaba).
# Precondición: el líder ya entró y el servidor ofrece la lectura.
appId: com.renaser.app
---
- runFlow: ../comun/abrir-mis-mentores.yaml
- scrollUntilVisible:
    element: "Hábitos de todos"
    direction: DOWN
    timeout: 60000
- takeScreenshot: H01a-mis-mentores-habitos-de-todos
- tapOn: "Hábitos de todos"
# Hoy, con el resumen del día y los hábitos (los que menos se cumplen, primero).
- extendedWaitUntil:
    visible: "Hoy"
    timeout: 30000
- assertVisible: "Día anterior"
- assertVisible: ".*alumnos con hábitos.*"
- takeScreenshot: H01b-habitos-de-hoy
# Un hábito → sus personas, por secciones (primero las que no cumplieron).
- scrollUntilVisible:
    element: ".*${HABITO}.*"
    direction: DOWN
    timeout: 60000
- tapOn: ".*${HABITO}.*"
- extendedWaitUntil:
    visible: "Buscar por nombre"
    timeout: 30000
- takeScreenshot: H01c-personas-del-habito
- tapOn: "Buscar por nombre"
- inputText: "${PERSONA}"
- hideKeyboard
- extendedWaitUntil:
    visible: ".*${PERSONA}.*"
    timeout: 30000
# Su ficha de siempre, abierta en el MISMO día (hoy). El patrón también coincide con el texto escrito en el buscador (el primero, arriba): se toca el segundo, la primera fila.
- tapOn:
    text: ".*${PERSONA}.*"
    index: 1
- scrollUntilVisible:
    element: ".*Escribirle.*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: H01d-ficha-de-la-persona
# Atrás: ficha → personas del hábito (con la búsqueda) → hábitos del día → «Mis mentores».
- back
- extendedWaitUntil:
    visible: "Buscar por nombre"
    timeout: 20000
- assertVisible: ".*${PERSONA}.*"
- back
- extendedWaitUntil:
    visible: "Día anterior"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "Mentores"
    timeout: 20000
- takeScreenshot: H01e-de-vuelta-en-mis-mentores
