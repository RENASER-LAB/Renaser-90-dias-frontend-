# C02 — Descartar una carrera: pide confirmación, se borra del teléfono y no se envía (spec 042). Precondición: README.
# cuenta: aprendiz
# spec 042 FR-013
# corrido: 2026-11-19
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
# «Kilómetros diarios» puede quedar abajo (en «Se te pasó la hora» según la hora): se baja hasta el botón.
- scrollUntilVisible:
    element: "Correr con GPS.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Correr con GPS.*"
- runFlow:
    when:
      visible: "Mientras se usa la app|While using the app"
    commands:
      - tapOn: "Mientras se usa la app|While using the app"
- runFlow:
    when:
      visible: "Permitir|Allow"
    commands:
      - tapOn: "Permitir|Allow"
# Si la cuenta regresiva (3 s) todavía se ve, se salta; si no, la carrera ya empezó sola.
- runFlow:
    when:
      visible: "Empezar ya"
    commands:
      - tapOn: "Empezar ya"
- extendedWaitUntil:
    visible: "Pausar la carrera"
    timeout: 8000
- longPressOn: "Pausar la carrera"
- extendedWaitUntil:
    visible: "Descartar esta carrera"
    timeout: 5000
- tapOn: "Descartar esta carrera"
- assertVisible: "¿Descartar esta carrera\\?"
- tapOn: "Descartar"
# Vuelve a Entrenar arriba de la lista: se baja hasta «Kilómetros diarios».
- scrollUntilVisible:
    element: "Correr con GPS.*"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Carrera en curso.*"
- takeScreenshot: C02-descartada
