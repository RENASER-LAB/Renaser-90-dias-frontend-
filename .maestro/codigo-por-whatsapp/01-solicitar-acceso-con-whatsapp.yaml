# Spec 043 — «Solicitar acceso» con WhatsApp y el código por WhatsApp a los 60 s.
# Precondición: sesión cerrada; backend local con `auth.codigo_whatsapp` PRENDIDO, la configuración de YCloud apuntando a un YCloud FALSO en
# 127.0.0.1 y los correos en noop (el código «no llega» al correo). Nunca contra producción.
# Después del flujo: el YCloud falso anotó el código; se escribe con `CODIGO` (ver el README de la carpeta).
appId: com.renaser.app
env:
  CORREO: e2e-043-${MAESTRO_RANDOM}@renaser.test
---
- launchApp
# spec 043 FR-003
- tapOn: "¿No tienes cuenta? Solicitar acceso"
# «Solicitar acceso» es por pasos desde la spec 052: nombre, correo, WhatsApp, el código y, después, la contraseña. El código se pide
# ANTES de la contraseña: este flujo se queda en la pantalla del código para probar «Por WhatsApp».
- tapOn: "Nombres"
- inputText: "Ana"
- tapOn: "Apellidos"
- inputText: "Prueba"
- tapOn: "Continuar"
- tapOn: "Correo electrónico"
- inputText: ${CORREO}
- tapOn: "Continuar"
- assertVisible: "Tu WhatsApp"
- tapOn: "Número de WhatsApp"
- inputText: "987654321"
- tapOn: "Continuar"
- takeScreenshot: 01-codigo-sin-enlace
# spec 043 FR-012
- extendedWaitUntil:
    visible: "Envíamelo por WhatsApp. Va a \\+51 9•• ••• •21"
    timeout: 75000
- assertVisible: "Verifica tu correo o WhatsApp"
- takeScreenshot: 02-enlace-a-los-60-segundos
- tapOn: "Envíamelo por WhatsApp.*"
# spec 043 FR-015
- extendedWaitUntil:
    visible: "Te lo enviamos por WhatsApp a \\+51 9•• ••• •21"
    timeout: 15000
- takeScreenshot: 03-enviado-por-whatsapp
