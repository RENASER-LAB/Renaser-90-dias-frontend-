# «Copiar a otra formación» (spec 023, historia 3). ESCRITO Y SIN CORRER.
# cuenta: admin  (Administración o Alquimista)
# Precondición: la Certificación tiene al menos una categoría activa (créala antes con «Categorías» si no) y ningún hábito «Descanso profundo».
# Cada corrida COPIA un hábito y no se puede deshacer desde la app: «Agua tibia con limón» ya está copiado en la base local (E2E del 01/11); hoy se copia «Descanso profundo»
# y el siguiente que sirve es «Ducha fria». Para repetirlo, cambia el nombre en las tres líneas `(?i).*…*`.
# Copia un hábito de la Escuela a la Certificación, en una categoría de ELLA; la copia aparece en la lista de la Certificación y la original sigue en la Escuela.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Administración"
    direction: DOWN
    timeout: 40000
- tapOn: "Administración"
- scrollUntilVisible:
    element: "Más opciones"
    direction: DOWN
    timeout: 40000
- tapOn: "Más opciones"
- scrollUntilVisible:
    element: "Hábitos del programa"
    direction: DOWN
    timeout: 40000
- tapOn: "Hábitos del programa"
- extendedWaitUntil:
    visible: "Escuela"
    timeout: 30000
- tapOn: "Escuela"
# Son 20 hábitos activos: «Descanso profundo» queda abajo de lo que se ve al abrir la lista, se baja hasta él.
- scrollUntilVisible:
    element: "(?i).*Descanso profundo.*"
    direction: DOWN
    timeout: 60000
- tapOn: "(?i).*Descanso profundo.*"
- scrollUntilVisible:
    element: "Copiar a otra formación"
    direction: DOWN
    timeout: 30000
# Elige la Certificación y una categoría de ella.
- tapOn:
    text: "Certificación"
    index: 0
- takeScreenshot: H04a-copiar-a-la-certificacion
# Debajo de «Categoría en Certificación» queda el botón: se baja hasta él.
- scrollUntilVisible:
    element: "Copiar a Certificación"
    direction: DOWN
    timeout: 30000
- tapOn: "Copiar a Certificación"
- extendedWaitUntil:
    visible: ".*Copiado.*|.*copiado.*|.*Certificación.*"
    timeout: 30000
- back
- back
# La Certificación ya lo tiene y la Escuela sigue con el suyo.
- tapOn: "Certificación"
- extendedWaitUntil:
    visible: "(?i).*Descanso profundo.*"
    timeout: 30000
- takeScreenshot: H04b-la-certificacion-tiene-la-copia
- tapOn: "Escuela"
- scrollUntilVisible:
    element: "(?i).*Descanso profundo.*"
    direction: DOWN
    timeout: 60000
