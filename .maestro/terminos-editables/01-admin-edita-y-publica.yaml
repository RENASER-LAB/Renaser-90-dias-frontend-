# Administración edita los términos de la Escuela, mira la vista previa, guarda el borrador y publica sin pedir aceptar de nuevo (spec 027, historia 1). ESCRITO Y SIN CORRER.
# cuenta: admin
# Precondición (base local): la migración V148–V150 aplicada (la Escuela con al menos una versión publicada; en la base local de hoy la vigente es la 2).
# Cada corrida publica una versión más, sin pedir aceptar de nuevo.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Administración"
    direction: DOWN
    timeout: 40000
- tapOn: "Administración"
- scrollUntilVisible:
    element: "Más opciones.*"
    direction: DOWN
    timeout: 40000
- tapOn: "Más opciones.*"
- scrollUntilVisible:
    element: "Términos y condiciones"
    direction: DOWN
    timeout: 40000
- tapOn: "Términos y condiciones"
- extendedWaitUntil:
    visible: "Escuela Renaser"
    timeout: 30000
- assertVisible: "Versión [0-9]+.*"
- assertVisible: "Diplomado Renaser"
# «Por revisar» es el Diplomado recién creado, sin versión publicada: en la base local de hoy ya tiene versiones, así que no siempre sale.
- assertVisible:
    text: "Por revisar"
    optional: true
- takeScreenshot: T01a-las-tres-formaciones
- tapOn: "Escuela Renaser.*"
- extendedWaitUntil:
    visible: "Versión [0-9]+ · vigente"
    timeout: 20000
# El número de la vigente cambia con cada corrida (la base local ya va por la 2): se lee y se espera la siguiente al publicar.
- copyTextFrom:
    text: "Versión [0-9]+ · vigente"
- evalScript: ${output.siguiente = 'Versión ' + (parseInt(maestro.copiedText.replace(/[^0-9]/g, ''), 10) + 1) + ' · vigente'}
- tapOn: "Editar"
- extendedWaitUntil:
    visible: "Cláusula 1"
    timeout: 20000
# Sin cambios no se publica.
- assertVisible: "No hay cambios respecto de la versión vigente."
- tapOn: "Agregar una cláusula"
- scrollUntilVisible:
    element: "Cláusula 24"
    direction: DOWN
    timeout: 20000
- assertVisible: "La cláusula 24 está vacía."
- tapOn: "Texto de la cláusula 24"
# Textos cortos y sin tildes: `inputText` con el dev client tarda ~7 a 10 s por letra y pasa de 120 s con más de ~10 (Maestro #3667), y Maestro no escribe bien
# los caracteres que no son ASCII. La cláusula se escribe en dos comandos.
- inputText: "Prueba "
- inputText: "E2E"
- takeScreenshot: T01b-editando
- tapOn: "Vista previa"
- extendedWaitUntil:
    visible: "Prueba E2E"
    timeout: 15000
- takeScreenshot: T01c-vista-previa
- tapOn: "Cerrar"
- tapOn: "Guardar borrador"
- extendedWaitUntil:
    visible: "Borrador guardado"
    timeout: 10000
- tapOn: "Publicar"
- extendedWaitUntil:
    visible: "Lo verán las personas que entren desde ahora"
    timeout: 15000
- tapOn: "Nota del cambio"
- inputText: "Nota E2E"
- takeScreenshot: T01d-publicar
- tapOn:
    text: "Publicar"
    index: 1
- extendedWaitUntil:
    visible: "${output.siguiente}"
    timeout: 30000
- assertVisible: "Historial"
- assertVisible: "Versión [0-9]+.*"
- takeScreenshot: T01e-historial
