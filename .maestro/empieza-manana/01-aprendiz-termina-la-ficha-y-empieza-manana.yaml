# 01 — El aprendiz que termina la ficha y los Términos ve «Tu programa empieza mañana», sin elegir nada, y «Entendido» activa el programa
# (spec 036, D-309: antes era «Elige tu Día 1» con tres fechas). ESCRITO Y SIN CORRER.
# Precondición: backend con la spec 036; aprendiz de la Escuela con la ficha y los Términos hechos y SIN su programa activado (`programa_activado_en`
# vacío). Con los Términos aceptados la app salta directo a este último paso. Se corre una vez por cuenta (activar no se deshace: volver a clonar la
# base o usar otra cuenta sin activar). Si el programa de la cuenta es del Diplomado, mira `04`.
# cuenta: aprendiz
appId: com.renaser.app
---
- extendedWaitUntil:
    visible: "Tu programa empieza mañana"
    timeout: 60000
- takeScreenshot: M01a-tu-programa-empieza-manana
# Poco texto: la fecha de mañana («<día> <n> de <mes>»), una línea con el plazo y un solo botón.
- assertVisible: "(Lunes|Martes|Miércoles|Jueves|Viernes|Sábado|Domingo) [0-9]+ de [a-z]+"
- assertVisible: "Son tus 90 días\\."
- assertVisible: "Entendido"
# Nada que elegir: ni lista de fechas ni los textos de antes.
- assertNotVisible: "Elige tu Día 1"
- assertNotVisible: "Confirmar mi Día 1"
- assertNotVisible: "Elegir mi Día 1"
- tapOn: "Entendido"
# Entra a la app y Hoy dice cuándo empieza (issue #72): el Día 1 es mañana, no hoy.
- extendedWaitUntil:
    visible: "TRAINING"
    timeout: 60000
- runFlow: ../comun/despejar-capas.yaml
- tapOn: "HOY"
- extendedWaitUntil:
    visible: ".*Tu programa empieza el .* de .*"
    timeout: 30000
- takeScreenshot: M01b-hoy-dice-cuando-empieza
