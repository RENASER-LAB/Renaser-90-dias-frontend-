# T07 — Una ACCIÓN del día con hora («Enviar la propuesta al cliente», 17:00) está en la lista entre los hábitos; su hoja trae el botón y
# lleva a la evidencia de siempre (foto, texto, audio o video); con una forma sale de la lista.
# Precondición: las acciones de hoy «Enviar la propuesta al cliente» (10:00, la verde) y «Llamar a mi mentor» (17:00) sin cumplir (la línea `# antes:` las deja así).
# antes: .maestro/comun/estado-de-hoy.sh PENDIENTE "accion:Enviar la propuesta al cliente" "accion:Llamar a mi mentor"
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: ".*Enviar la propuesta al cliente.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: ".*[Aa]cción de tus objetivos.*"
- tapOn: ".*Enviar la propuesta al cliente.*"
- extendedWaitUntil:
    visible: "Marcar como hecha"
    timeout: 10000
- takeScreenshot: T07a-hoja-de-la-accion
- tapOn: "Marcar como hecha"
- runFlow: ../comun/entregar-evidencia-de-texto.yaml
- runFlow: ../comun/cerrar-aviso-dev.yaml
- extendedWaitUntil:
    visible: "Evidencia entregada.*"
    timeout: 8000
    optional: true   # el aviso en línea dura unos segundos: lo que se prueba es que la fila sale de la lista
- takeScreenshot: T07b-accion-registrada
- extendedWaitUntil:
    notVisible: "10:00, Enviar la propuesta al cliente.*"
    timeout: 20000
