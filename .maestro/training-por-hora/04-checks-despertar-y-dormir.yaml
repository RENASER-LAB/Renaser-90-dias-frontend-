# T04 — El ✓ de la fila marca sin abrir nada: DESPERTAR (sin hora) y DORMIR registran la hora y salen de la lista.
# Precondición: `reset-hoy.sql`.
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: "(?i)Marcar DORMIR"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "(?i)Marcar DORMIR"
- assertNotVisible: "Guía de esta práctica"
- extendedWaitUntil:
    notVisible: "(?i)Marcar DORMIR"
    timeout: 20000
- scrollUntilVisible:
    element: "(?i)Marcar DESPERTAR"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "(?i)Marcar DESPERTAR"
- extendedWaitUntil:
    notVisible: "(?i)Marcar DESPERTAR"
    timeout: 20000
- scrollUntilVisible:
    element: ".* hechos? hoy"
    direction: DOWN
    timeout: 30000
- tapOn: ".* hechos? hoy"
- scrollUntilVisible:
    element: "(?i)22:30, DORMIR.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: T04a-dormir-y-despertar-hechos
