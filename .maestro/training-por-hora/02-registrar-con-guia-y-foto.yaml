# T02 — Un toque, una hoja (spec 014): un hábito CON guía (RITUAL TIERRA - AGUA - FUEGO (mañana), atrasado) abre la hoja con la
# guía plegada y «Tomar foto»; la guía se despliega sin marcar nada; la foto abre «¿Qué sentiste?» (los rituales preguntan) y,
# al terminar, el ritual sale de la lista y sube a «hechos hoy».
# Precondición: `reset-hoy.sql`; fotos en local (fotos-local + adb reverse tcp:9002).
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: ".*RITUAL TIERRA - AGUA - FUEGO \\(mañana\\).*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ".*RITUAL TIERRA - AGUA - FUEGO \\(mañana\\).*"
- extendedWaitUntil:
    visible: "Guía de esta práctica"
    timeout: 10000
- assertVisible: "Tomar foto"
- assertVisible: ".*Se te pasó la hora.*"
- assertNotVisible: "Qué hacer"
- takeScreenshot: T02a-hoja-con-guia-plegada
- tapOn: "Guía de esta práctica"
- assertVisible: "Qué hacer"
- assertVisible: "Leer la guía no marca el hábito."
- takeScreenshot: T02b-hoja-con-guia-abierta
- tapOn: "Tomar foto"
- runFlow: ../comun/tomar-foto.yaml
- extendedWaitUntil:
    visible: "¿Qué sentiste\\?"
    timeout: 20000
- takeScreenshot: T02c-foto-y-que-sentiste
- tapOn: "Cuéntalo con tus palabras"
- inputText: "Bien"
- hideKeyboard
- tapOn: "TERMINAR"
- runFlow: ../comun/cerrar-aviso-dev.yaml
- extendedWaitUntil:
    visible: "Evidencia entregada.*"
    timeout: 8000
    optional: true   # el aviso en línea dura unos segundos: lo que se prueba es que la fila sale de la lista
- takeScreenshot: T02d-ritual-registrado
- extendedWaitUntil:
    notVisible: ".*RITUAL TIERRA - AGUA - FUEGO \\(mañana\\), Se te pasó.*|06:45, RITUAL TIERRA - AGUA - FUEGO \\(mañana\\)"
    timeout: 20000
