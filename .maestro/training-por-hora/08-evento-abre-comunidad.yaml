# T08 — Un evento de hoy al que dijo «Voy» está en la lista, con «Evento · Zoom»; tocarlo abre su detalle en Comunidad → Eventos
# (no hay hoja de registro: un evento no se «hace»). El evento de la mañana, que ya terminó, no está.
# Precondición: el evento «Sesión de grupo E2E (tarde)» sembrado, con «Voy» y link de Zoom. Su hora cambia con cada corrida: la línea `# antes:` lo pone a 45 min
# desde ahora (un evento que ya terminó no sale de la lista de hoy).
# antes: .maestro/comun/evento-de-prueba.sh "Sesión de grupo E2E (tarde)" 45
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- assertNotVisible: ".*Sesión en vivo E2E \\(ya terminó\\).*"
- scrollUntilVisible:
    element: ".*Sesión de grupo E2E \\(tarde\\).*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: ".*Evento · Zoom.*"
- tapOn: ".*Sesión de grupo E2E \\(tarde\\).*"
- extendedWaitUntil:
    visible: "Volver a Eventos"
    timeout: 20000
- assertVisible: "Sesión de grupo E2E \\(tarde\\)"
- takeScreenshot: T08a-evento-en-comunidad
