# T11 — Hábitos de evidencia OPCIONAL (Escritura libre nocturna, Día sin celular…): la fila lleva solo «Subir» (sin círculo, ajuste del
# 2026-10-30); tocar el nombre abre la hoja con «Subir evidencia» y «Marcar como hecho». «Última comida del día» es la excepción: lleva
# el círculo (2026-10-31, punto 8). Actualizado el 02/11/2026 a la app de hoy.
# Precondición: aprendiz de la Escuela con esos tres hábitos PENDIENTES hoy (los deja la línea `# antes:`: este flujo los cumple).
# antes: .maestro/comun/estado-de-hoy.sh PENDIENTE "ESCRITURA LIBRE NOCTURNA" PHONE_FREE_DAY "ÚLTIMA COMIDA DEL DÍA"
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: "Subir evidencia de Escritura libre nocturna"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Subir evidencia de Día sin celular"
# Sin círculo en los opcionales.
- assertNotVisible: "Marcar Escritura libre nocturna"
- assertNotVisible: "Marcar Día sin celular"
- takeScreenshot: T11a-fila-con-subir
# La fila empieza por su hora: «.*Escritura…» también casaba con el botón «Subir evidencia de Escritura…» y lo tocaba.
- tapOn: "[0-9:]+, Escritura libre nocturna.*"
- extendedWaitUntil:
    visible: "Subir evidencia"
    timeout: 10000
- assertVisible: "Marcar como hecho"
- takeScreenshot: T11b-hoja-subir-evidencia-y-marcar
- tapOn: "Subir evidencia"
- runFlow: ../comun/entregar-evidencia-de-texto.yaml
- runFlow: ../comun/cerrar-aviso-dev.yaml
- extendedWaitUntil:
    visible: "Evidencia entregada.*"
    timeout: 8000
    optional: true   # el aviso en línea dura unos segundos: lo que se prueba es que la fila sale de la lista
- takeScreenshot: T11c-escritura-entregada
- extendedWaitUntil:
    notVisible: "Subir evidencia de Escritura libre nocturna"
    timeout: 20000
# Por separado, «Marcar como hecho» de la hoja cierra sin evidencia.
- scrollUntilVisible:
    element: "[0-9:]+, Día sin celular.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "[0-9:]+, Día sin celular.*"
- extendedWaitUntil:
    visible: "Marcar como hecho"
    timeout: 10000
- tapOn: "Marcar como hecho"
- extendedWaitUntil:
    notVisible: "Subir evidencia de Día sin celular"
    timeout: 20000
- takeScreenshot: T11d-dia-sin-celular-marcado
# «Última comida del día»: el círculo la cierra de un toque, sin pedir foto.
- scrollUntilVisible:
    element: "Marcar Última comida del día"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertNotVisible: "Subir evidencia de Última comida del día"
- tapOn: "Marcar Última comida del día"
- extendedWaitUntil:
    notVisible: "Marcar Última comida del día"
    timeout: 20000
- assertNotVisible: "Tomar foto|Entregar evidencia"
- takeScreenshot: T11e-ultima-comida-cerrada-con-el-circulo
