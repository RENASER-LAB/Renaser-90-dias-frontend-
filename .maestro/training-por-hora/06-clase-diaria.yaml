# T06 — La Clase diaria desde la lista: la fila abre la hoja (con guía) y «Ver la clase»; si la lección del día ya está
# completada abre el resumen «¿Qué entendiste de la clase?» y, al enviar, la clase sale de la lista. (Si la lección no está
# completada, «Ver la clase» lleva a la lección en Comunidad → Cursos, como siempre.)
# Precondición: `reset-hoy.sql` y la lección del día ya completada (en la base clonada lo está tras el E2E manual).
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: ".*Clase diaria.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: ".*Clase diaria.*"
- extendedWaitUntil:
    visible: "Ver la clase"
    timeout: 10000
- takeScreenshot: T06a-hoja-de-la-clase
- tapOn: "Ver la clase"
- extendedWaitUntil:
    visible: "¿Qué entendiste de la clase\\?|Volver al curso"
    timeout: 30000
- takeScreenshot: T06b-clase-abierta
- runFlow:
    when:
      visible: "¿Qué entendiste de la clase\\?"
    commands:
      - tapOn: "Hoy entendí que.*"
      - inputText: "Entendi bastante"
      - hideKeyboard
      - tapOn: "Enviar y completar"
      - extendedWaitUntil:
          visible: "Clase diaria completada.*"
          timeout: 8000
          optional: true
