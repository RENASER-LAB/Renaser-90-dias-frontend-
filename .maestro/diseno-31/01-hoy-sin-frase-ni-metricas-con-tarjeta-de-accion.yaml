# Hoy después de los cambios de diseño del 2026-10-31 (corrido el 02/11/2026).
# Versión final del 31/10: Hoy es «HOY», la frase del día, la tarjeta de acciones, el fénix y «Hábitos de hoy» / Radar. Sin la cabecera de fase,
# «Día N de 90» y puntos, y sin Coherencia / Racha (están en Yo). La tarjeta de acciones va antes de «Tu acompañante» («Empezar ahora ›»
# lleva a Training con la acción abierta); «Hábitos de hoy» y el Radar sin la línea de detalle; el semáforo ya no está en Hoy.
# Precondición: aprendiz con una acción agendada hoy sin cumplir (Plan → Agendar; la línea `# antes:` deja sin cumplir las de Ana) y sus tres objetivos de 90 días.
# (Spec 026: el Mapa de Renacimiento se retiró; ya no hay tarjeta del Mapa en Hoy.)
# antes: .maestro/comun/estado-de-hoy.sh PENDIENTE "accion:Enviar la propuesta al cliente" "accion:Llamar a mi mentor"
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "HOY"
# Hoy del 31/10 (versión final): sin la cabecera de fase, día y puntos («Día N de 90»); queda «HOY», la frase, la tarjeta de acción y el fénix.
- extendedWaitUntil:
    visible: "Tu acompañante"
    timeout: 30000
- assertNotVisible: "Día [0-9]+ de 90"
- assertNotVisible: "Fase [0-9] de 4"
# Lo que se quitó.
- assertNotVisible: "Coherencia"
- assertNotVisible: "Racha"
- assertNotVisible: "Récord histórico"
- assertNotVisible: "Consistencia del día"
- assertNotVisible: "Tu semáforo · últimos 7 días"
- assertNotVisible: "Prioridad #1 del día"
# La tarjeta nueva, antes de «Tu acompañante».
- assertVisible: "Empezar ahora"
- assertVisible: "Meta: .*"
- assertNotVisible: "Iniciar enfoque"
- takeScreenshot: D01a-hoy-con-la-tarjeta-de-accion
- scrollUntilVisible:
    element: "Tu acompañante"
    direction: DOWN
    timeout: 30000
# «Hábitos de hoy» y el Radar, sin la línea de detalle.
- scrollUntilVisible:
    element: "Hábitos de hoy"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Te toca ahora.*"
- assertNotVisible: "Cinco preguntas, un minuto.*"
- takeScreenshot: D01b-habitos-y-radar-sin-detalle
# «Empezar ahora ›» abre la acción en Training.
- scrollUntilVisible:
    element: "Empezar ahora"
    direction: UP
    timeout: 30000
- tapOn: "Empezar ahora"
- extendedWaitUntil:
    visible: ".* de .* hechos · .* pts|Marcar como hecha|Se te pasó la hora.*"
    timeout: 20000
- takeScreenshot: D01c-training-con-la-accion
