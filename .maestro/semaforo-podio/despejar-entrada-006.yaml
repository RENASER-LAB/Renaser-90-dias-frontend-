# Capas que aparecen al entrar con algunas cuentas de la 006 y que `ya-adentro.yaml` no conoce:
# - INICIO (primeros 7 días): el Código Renaser de la hora, «Innegociable», tapa Hoy hasta registrarlo.
# - CUENTA_PAUSADA: al reactivarse llega un aviso del soporte y la app abre ese chat.
appId: com.renaser.app
---
# Primero el permiso de avisos y las capas de siempre: el permiso puede tapar el Código Renaser.
- runFlow: ../comun/despejar-capas.yaml
- extendedWaitUntil:
    visible: "TRAINING|Estoy…|Soporte · Equipo Renaser"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Estoy…"
    commands:
      - tapOn: "Estoy…"
      # `inputText` con el dev client pasa de 120 s con más de ~10 letras (Maestro #3667): los textos largos van en comandos cortos.
      - inputText: "Probando "
      - inputText: "la app"
      - tapOn: "Estoy pensando en…"
      - inputText: "El mensa"
      - inputText: "je del s"
      - inputText: "emaforo"
      - hideKeyboard
      - tapOn: "Siento…"
      - inputText: "Calma"
      - hideKeyboard
      - tapOn: "Estoy evitando…"
      - inputText: "Nada"
      - hideKeyboard
      - tapOn: "Registrar"
- runFlow:
    when:
      visible: "Soporte · Equipo Renaser"
    commands:
      - back
