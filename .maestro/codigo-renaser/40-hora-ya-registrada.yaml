# cuenta: aprendiz (días 1 a 7, con el Código Renaser de esta hora ya registrado en el servidor)
# Corrección del 2026-10-19: al entrar, el formulario no se abre mientras la app no sabe si la hora ya se respondió,
# y no queda una capa oscura encima de Hoy. La tarjeta del Código Renaser aparece directamente en «Registrado».
# Corrección del 2026-10-30 (spec 016): el Código Renaser ya no es una tarjeta aparte sino la mitad derecha de «Hábitos de
# hoy», y su estado se lee «09:00 · Registrado» en un solo texto; «Registrado» a secas ya no coincide con ningún elemento.
appId: com.renaser.app
---
- runFlow: ../comun/despejar-capas.yaml
- extendedWaitUntil:
    visible: "TRAINING"
    timeout: 30000
- assertNotVisible: "¿Dónde estás ahora mismo\\?"
- scrollUntilVisible:
    element: ".*· Registrado"
    direction: DOWN
    timeout: 20000
- assertVisible: "Listo por esta hora.*"
# Al bajar, la barra de pestañas se esconde (D-246): un deslizamiento hacia arriba la devuelve antes de tocar PLAN.
- swipe:
    start: 50%,30%
    end: 50%,70%
- tapOn: "PLAN"
- assertVisible: "PLAN"
- tapOn: "HOY"
- takeScreenshot: codigo-renaser-registrado
