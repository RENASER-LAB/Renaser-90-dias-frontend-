# 02 — Entra CON cronograma: debajo de «Mi aceptación» sale «Mi cronograma de pagos» con la frase de la cláusula 19; sin esa casilla no avanza; al firmar queda confirmado
# el cronograma con la MISMA confirmación de «Mi ingreso», que ya no lo vuelve a pedir (spec 039, D-312). ESCRITO Y SIN CORRER.
# cuenta: aprendiz
# Precondición (base local): backend con la spec 039; aprendiz de la Escuela aceptado «Con cronograma» (soles, 2 cuotas de S/ 500: 15 nov y 15 dic), con la ficha terminada,
# los Términos SIN aceptar y su programa SIN activar. Sembrar con `PUT /api/v1/admin/pagos/personas/{id}`: { "mode": "SCHEDULE", "currency": "PEN", "installments": [
# {"dueDate": "2026-11-15", "amount": 500}, {"dueDate": "2026-12-15", "amount": 500} ] }. Se corre una vez por cuenta.
appId: com.renaser.app
---
- extendedWaitUntil:
    visible: "Lee atentamente las 23 cláusulas y sella tu aceptación\\."
    timeout: 60000
- scrollUntilVisible:
    element: "(?i)mi aceptación"
    direction: DOWN
    timeout: 40000
- assertVisible: "Formación RENASER · 90 días"
# Debajo: la sección del cronograma, con el estilo de «Mi ingreso».
- scrollUntilVisible:
    element: "Mi cronograma de pagos"
    direction: DOWN
    timeout: 30000
- assertVisible: "Revisa las fechas y los montos acordados\\. Moneda: Soles \\(S/\\)\\."
- assertVisible: "15 nov.*"
- assertVisible: "15 dic.*"
- assertVisible: "S/.500"
- assertVisible: "Pendiente"
- assertVisible: "Acepto el cronograma de pagos registrado en NASER y me comprometo a cumplirlo\\."
- takeScreenshot: A02a-mi-cronograma-de-pagos
# Con los términos y la firma pero SIN la casilla del cronograma no avanza y dice cuál falta.
- runFlow:
    file: comun-firmar.yaml
    env:
      BOTON: "Continuar"
- assertVisible: "Cronograma por aceptar"
- tapOn: "OK"
- takeScreenshot: A02b-falta-la-casilla-del-cronograma
- scrollUntilVisible:
    element: "Acepto el cronograma de pagos registrado en NASER y me comprometo a cumplirlo\\."
    direction: UP
    timeout: 30000
- tapOn: "Acepto el cronograma de pagos registrado en NASER y me comprometo a cumplirlo\\."
- scrollUntilVisible:
    element: "Continuar"
    direction: DOWN
    timeout: 30000
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "Tu programa empieza mañana"
    timeout: 60000
- tapOn: "Entendido"
- extendedWaitUntil:
    visible: "TRAINING"
    timeout: 60000
# Una sola firma dejó confirmado el cronograma: «Mi ingreso» dice cuándo y no lo vuelve a pedir.
- runFlow: ../pagos/comun-abrir-mi-ingreso.yaml
- assertVisible: "Tus fechas de pago"
- assertVisible: "Confirmaste tu cronograma el .*"
- assertNotVisible: "Confirmar cronograma"
- assertNotVisible: "Revisé mis fechas y montos\\."
- takeScreenshot: A02c-mi-ingreso-ya-confirmado
