# 03 — Quien ya estaba dentro vuelve a aceptar el texto nuevo: «Actualizamos nuestros términos» con «Mi aceptación» con su programa y sus fechas REALES (ya empezó) y SIN la
# sección «Mi cronograma de pagos», aunque tenga uno (spec 039, D-312). ESCRITO Y SIN CORRER.
# cuenta: aprendiz
# Precondición (base local): backend con la spec 039 (V162 publica la versión 2 de la Escuela pidiendo aceptar de nuevo); aprendiz de la Escuela con el programa YA ACTIVADO
# y aceptada la versión 1. Mejor si además tiene un cronograma SIN confirmar: así se ve que aquí no se ofrece.
appId: com.renaser.app
---
- runFlow: ../comun/despejar-capas.yaml
- extendedWaitUntil:
    visible: "Actualizamos nuestros términos"
    timeout: 40000
- assertVisible: "Lo que cambió"
- assertVisible: "Nuevo Acuerdo de transformación"
- assertNotVisible: "TRAINING"
- scrollUntilVisible:
    element: "(?i)mi aceptación"
    direction: DOWN
    timeout: 40000
- assertVisible: "Formación RENASER · 90 días"
- assertVisible: "Fecha de inicio"
- assertVisible: "Fecha de finalización"
- assertNotVisible: "Mi cronograma de pagos"
- assertNotVisible: "Acepto el cronograma de pagos registrado en NASER.*"
- takeScreenshot: A03a-mi-aceptacion-al-volver-a-aceptar
- runFlow:
    file: comun-firmar.yaml
    env:
      BOTON: "Aceptar"
- extendedWaitUntil:
    visible: "TRAINING"
    timeout: 60000
# Firmar los términos no confirmó el cronograma: a quien ya estaba dentro se le sigue pidiendo en «Mi ingreso» (spec 032).
- runFlow: ../pagos/comun-abrir-mi-ingreso.yaml
- assertVisible: "Confirmar cronograma|Tu pago fue cancelado"
- takeScreenshot: A03b-mi-ingreso-sigue-como-antes
