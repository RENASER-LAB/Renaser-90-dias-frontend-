# 14 — Un día «Sin Radar»: hoy no se ofrece «Registrar ahora», dice «Hoy no tienes Mi Radar», y al dejarlo como los demás
# días vuelve a ofrecerse (escenario 14, cuarta ronda). Marca el día de la semana de HOY, el que sea cuando corra el flujo.
# cuenta: aprendiz (día 10 con Mi Radar encendido en 09:00, 14:00 y 20:00, SIN días propios, y la hora en curso entre 03:00
# y 23:59; correr después de 13 y antes de 07).
appId: com.renaser.app
---
- evalScript: ${output.dia = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][new Date().getDay()]}
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Encendido · .*"
    direction: DOWN
- tapOn: "Encendido · .*"
- extendedWaitUntil:
    visible: "Registrar ahora|Ya registraste esta hora"
    timeout: 20000
- scrollUntilVisible:
    element: "Tus horas"
    direction: DOWN
# Hoy sin Radar: se marca el día de hoy, «Sin Radar ese día» y se guarda.
- tapOn: "${output.dia}.*"
- tapOn: "Sin Radar ese día"
- tapOn: "Guardar horas · .*"
- extendedWaitUntil:
    visible: "Todos los días"
    timeout: 30000
# Ya no se puede registrar hoy: en su lugar, el aviso. Y «Hoy» no inventa «Sin registro» para horas que no existen.
- scrollUntilVisible:
    element: "Hoy no tienes Mi Radar"
    direction: UP
- assertVisible: "Hoy no tienes Mi Radar"
- assertNotVisible: "Registrar ahora"
- assertNotVisible: "Ya registraste esta hora"
- assertNotVisible: "[0-9]+:00 · Sin registro"
- takeScreenshot: 14a-hoy-sin-radar
# Dejarlo como los demás días: vuelve «Registrar ahora».
- scrollUntilVisible:
    element: "Tus horas"
    direction: DOWN
- tapOn: "${output.dia}.*"
- tapOn: "Dejar .* como los demás días"
- extendedWaitUntil:
    visible: "Todos los días"
    timeout: 30000
- scrollUntilVisible:
    element: "Registrar ahora|Ya registraste esta hora"
    direction: UP
- assertNotVisible: "Hoy no tienes Mi Radar"
- takeScreenshot: 14b-hoy-con-radar
