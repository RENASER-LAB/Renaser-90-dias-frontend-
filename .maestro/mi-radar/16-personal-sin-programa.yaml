# 16 — El personal sin programa activado ve la fila «Mi Radar» en Yo con «Primero empieza tu programa»; al tocarla, el motivo y el botón
# «Empezar mañana»; al activar («Tu programa empieza mañana» → «Entendido»), la pantalla vuelve a leer y dice cuándo empieza (spec 019, escenario 16;
# spec 036: ya no se elige el Día 1).
# cuenta: líder (e2e-radar-lider@renaser.test) SIN fila en el programa. Activar el programa CREA esa fila, así que el flujo se corre una vez
# por cuenta: para repetirlo, la otra cuenta sin fila (e2e-radar-mentor2@renaser.test) o volver a clonar la base. Hay que correrlo con el
# backend de la spec 019 (403 con `codigo`): con uno anterior la fila no aparece, que también es lo que se espera de él (FR-010).
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Primero empieza tu programa"
    direction: DOWN
- assertVisible: "Mi Radar"
- takeScreenshot: 16a-yo-fila-sin-programa
- tapOn: "Primero empieza tu programa"
# El motivo en una línea y el botón; ni interruptor ni nada de Mi Radar. Sin parpadeo: no pasa por «Cargando…» (el motivo ya se sabía).
- extendedWaitUntil:
    visible: "Mi Radar empieza en tu día 8\\. Primero empieza tu programa\\."
    timeout: 20000
- assertVisible: "Empezar mañana"
- assertNotVisible: "Encendido"
- assertNotVisible: "Automático"
- assertNotVisible: "Registrar ahora"
- assertNotVisible: "Cargando Mi Radar…"
- takeScreenshot: 16b-motivo-y-boton
- tapOn: "Empezar mañana"
- extendedWaitUntil:
    visible: "Tu programa empieza mañana"
    timeout: 20000
- takeScreenshot: 16c-tu-programa-empieza-manana
- tapOn: "Entendido"
# Al volver, vuelve a leer: ya no es «sin programa» y dice cuándo empieza.
- extendedWaitUntil:
    visible: "Mi Radar empieza en tu día 8.*"
    timeout: 40000
# El motivo de antes no vuelve a asomar, ni el botón, ni el formulario.
- assertNotVisible: "Mi Radar empieza en tu día 8\\. Primero empieza tu programa\\."
- assertNotVisible: "Empezar mañana"
- assertNotVisible: "Encendido"
- takeScreenshot: 16d-empieza-el-dia-8
# Ya con Día 1 la fila de Yo desaparece (Mi Radar empieza en el día 8). Antes del Día 1 Yo no dibuja la fase ni el semáforo (issue #102): dice
# «Tu programa empieza el …», con el ancla de siempre, «Coherencia».
- back
- assertVisible: "Coherencia"
- extendedWaitUntil:
    visible: ".*Tu programa empieza.*"
    timeout: 20000
- scrollUntilVisible:
    element: "Tuve una emergencia"
    direction: DOWN
    optional: true
- assertNotVisible: "Primero empieza tu programa"
- takeScreenshot: 16e-yo-sin-la-fila
