# 13 — Mi Radar por día de la semana (cuarta ronda): el sábado sin Radar, el domingo con sus horas, la fila de Yo lo resume,
# y «Dejar … como los demás días» los devuelve. Misma forma que «Planificar» de los hábitos (escenario 13).
# cuenta: aprendiz (día 10 con Mi Radar encendido en 09:00, 14:00 y 20:00 y SIN días propios; correr después de 05 y antes
# de 07). Después hay que mirar `dumpsys alarm`: alarmas semanales `renaser.radar.slot.d{día}.HH`, ninguna el sábado (lo hace
# el informe, no el flujo).
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Encendido · 09:00, 14:00 y 20:00"
    direction: DOWN
- tapOn: "Encendido · 09:00, 14:00 y 20:00"
- scrollUntilVisible:
    element: "Tus horas"
    direction: DOWN
# Sin días marcados: «Todos los días» y nada de «Sin Radar».
- assertVisible: "Todos los días"
- assertNotVisible: "Sin Radar ese día"
- takeScreenshot: 13a-todos-los-dias
# Marcar el sábado: «Solo sáb», su interruptor y las horas que sigue (las de todos los días).
- tapOn: "Sábado.*"
- assertVisible: "Solo sáb"
- assertVisible: "Sin Radar ese día"
# Con la fila de días, el contador queda debajo del interruptor: se baja hasta él.
- scrollUntilVisible:
    element: "3 de 12 horas elegidas"
    direction: DOWN
- assertVisible: "3 de 12 horas elegidas"
# Nada tocado, nada que guardar.
- assertNotVisible: "Guardar horas · sáb"
- tapOn: "Sin Radar ese día"
# Sin Radar esconde las horas y aparece el botón con los días.
- assertVisible: "Guardar horas · sáb"
- assertNotVisible: "3 de 12 horas elegidas"
- takeScreenshot: 13b-sabado-sin-radar
- tapOn: "Guardar horas · sáb"
# Guardado: vuelve a «Todos los días» y el chip del sábado dice «sin Radar» al lector de pantalla.
- extendedWaitUntil:
    visible: "Todos los días"
    timeout: 30000
- assertVisible: "Sábado.*sin Radar"
- takeScreenshot: 13c-guardado
# El domingo con sus propias horas: se desmarcan las de todos y se elige una.
- tapOn: "Domingo.*"
- assertVisible: "Solo dom"
- scrollUntilVisible:
    element: "14:00"
    direction: DOWN
- tapOn: "14:00"
- tapOn: "20:00"
- tapOn: "11:00"
- assertVisible: "2 de 12 horas elegidas"
- tapOn: "Guardar horas · dom"
- extendedWaitUntil:
    visible: "Todos los días"
    timeout: 30000
- assertVisible: "Domingo.*horas propias: 09:00 y 11:00"
# La fila de Yo lo resume en una línea que se parte en renglones, sin cortarse.
- back
- extendedWaitUntil:
    visible: "Encendido · 09:00, 14:00 y 20:00 · sáb sin Radar · dom 09:00 y 11:00"
    timeout: 15000
- takeScreenshot: 13d-yo-fila-con-dias
# Dejar ambos como los demás días: vuelve a ser el de siempre.
- tapOn: "Encendido · .*sin Radar.*"
- scrollUntilVisible:
    element: "Tus horas"
    direction: DOWN
- tapOn: "Sábado.*"
- tapOn: "Domingo.*"
- assertVisible: "Solo sáb, dom"
- assertVisible: "Dejar sáb, dom como los demás días"
- tapOn: "Dejar sáb, dom como los demás días"
- extendedWaitUntil:
    notVisible: "Sábado.*sin Radar"
    timeout: 30000
- back
- extendedWaitUntil:
    visible: "Encendido · 09:00, 14:00 y 20:00"
    timeout: 15000
- takeScreenshot: 13e-yo-fila-igual-que-antes
