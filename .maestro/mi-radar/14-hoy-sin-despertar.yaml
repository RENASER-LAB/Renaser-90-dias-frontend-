# 14 — Un día sin Despertar: no hay Mi Radar ese día; en lugar de «Hora», «Falta tu hora de Despertar» y fijo abajo «Programar
# mi Despertar», que lleva a Training; no se ofrece «Registrar ahora» (spec 019, escenario 14).
# cuenta: aprendiz (día 10 con Mi Radar encendido y SIN hora de Despertar en preferencias_horario ni apagado: el de fábrica no
# trae hora). Se corre de cualquier día.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "YO"
- scrollUntilVisible:
    element: "Encendido · .*"
    direction: DOWN
- takeScreenshot: 14a-yo-fila-hoy-sin-radar
- tapOn: "Encendido · .*"
- extendedWaitUntil:
    visible: "Falta tu hora de Despertar"
    timeout: 20000
- assertVisible: "Programar mi Despertar"
- assertVisible: "Hoy no tienes Mi Radar"
- assertNotVisible: "Registrar ahora"
- assertNotVisible: "Ahora: .*"
- takeScreenshot: 14b-falta-el-despertar
- tapOn: "Programar mi Despertar"
# Lleva a Training, donde se programa el Despertar (y el Dormir).
- extendedWaitUntil:
    visible: "Planificar.*"
    timeout: 30000
- takeScreenshot: 14c-training
