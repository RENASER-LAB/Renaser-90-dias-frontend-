# 12 — Líder de mentores: Yo → «Mis mentores» → grupo → persona, y en su ficha el mismo bloque «CÓDIGO RENASER»
# con el estado de Mi Radar y sus registros (escenario 11, rama del líder).
# cuenta: admin (la ranura E2E_ADMIN_* apunta al LÍDER). E2E_PERSONA = parte del nombre del aprendiz y E2E_GRUPO = parte
# del nombre de su grupo («Grupo Radar E2E»). Precondición: igual que el flujo 10.
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
# Spec 018 → 2026-10-31: el resultado por grupo está en «Mis mentores», que ya no es una pestaña de Hoy sino una fila de Yo
# (ya no hay una tarjeta «Semáforo por grupos» ni la línea «Toca un grupo para ver a sus personas.»).
- tapOn: "YO"
- scrollUntilVisible:
    element: "Mis mentores"
    direction: DOWN
    timeout: 40000
- tapOn: "Mis mentores"
- extendedWaitUntil:
    visible: "Resultado por grupo"
    timeout: 30000
- scrollUntilVisible:
    element: ".*${GRUPO}.*"
    direction: DOWN
    timeout: 60000
- tapOn: ".*${GRUPO}.*"
- extendedWaitUntil:
    visible: ".*${PERSONA}.*Abrir su detalle.*"
    timeout: 30000
- tapOn: ".*${PERSONA}.*Abrir su detalle.*"
- scrollUntilVisible:
    element: "CÓDIGO RENASER"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Mi Radar: encendido · 05:30 a 22:30 · 17 veces"
    direction: DOWN
    timeout: 30000
- assertVisible: "Mi Radar: encendido · 05:30 a 22:30 · 17 veces"
- scrollUntilVisible:
    element: "Prevista [0-9][0-9]:00 · respondida .*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 12-ficha-del-lider-codigo-renaser
