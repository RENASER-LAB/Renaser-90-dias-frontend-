# 02 — Día 10: Yo → «Mi Radar» llega apagado: solo «Encendido», sin modo, horario ni registrar (spec 019, escenario 2).
# cuenta: aprendiz (día 10 del programa, con Mi Radar apagado: participantes_programa.mi_radar_encendido = false)
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
# Desde el día 8 el Código Renaser ya no se abre solo.
- assertNotVisible: "¿Dónde estás ahora mismo\\?"
- tapOn: "YO"
- assertVisible: "Tu evolución"
- scrollUntilVisible:
    element: "Tuve una emergencia"
    direction: DOWN
    optional: true
- scrollUntilVisible:
    element: "Apagado"
    direction: DOWN
- assertVisible: "Mi Radar"
- takeScreenshot: 02a-yo-fila-mi-radar-apagado
- tapOn: "Apagado"
- extendedWaitUntil:
    visible: "Encendido"
    timeout: 15000
# Apagado no hay modo, horario, días ni registrar: lo único que se puede hacer es encenderlo.
- assertNotVisible: "Automático"
- assertNotVisible: "Personalizado"
- assertNotVisible: "Hora"
- assertNotVisible: "Todos los días"
- assertNotVisible: "Registrar ahora"
# Sin los textos de explicación de la versión anterior.
- assertNotVisible: "Lo ves tú, tu mentor.*"
- assertNotVisible: "Te preguntamos cómo estás.*"
# Ni las respuestas de la persona (ni «Hoy», ni «Historial», ni «Patrones»): eso lo ven su mentor y su líder en la ficha.
- assertNotVisible: "Historial"
- assertNotVisible: "Patrones"
- assertNotVisible: "Hoy: .*"
- takeScreenshot: 02b-mi-radar-apagado
- back
- assertVisible: "Tu evolución"
