# PR03 — Tocar el siguiente nivel de hoy abre la acción en Entrenar, como hoy (FR-005); el «+» abre «Agendar mis acciones» y el cofre abre la revisión de la semana
# (nota del 1 al 10, qué te frenó y qué harás distinto).
# Precondición: `plan.ruta` prendida y los datos de `plan-ruta/datos.sh semana-con-acciones` (semana 1 armada, «Caminar» y «Leer» de hoy, «Ver» mañana) seguidos de
# `plan-ruta/datos.sh semana-sin-revisar` (el cofre solo se abre con la semana sin revisar). Si «Código Renaser» pide registro, `ya-adentro` lo hace.
# corrido: 2026-11-26
# cuenta: e2e-ap-web@renaser.test
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "PLAN"
- extendedWaitUntil:
    visible: "Planifica tus objetivos"
    timeout: 30000
- takeScreenshot: pr03-la-ruta
- tapOn: "Agendar otro día.*"
- extendedWaitUntil:
    visible: "Agendar mis acciones"
    timeout: 15000
- takeScreenshot: pr03-el-mas
- pressKey: back
- extendedWaitUntil:
    visible: "Cierra tu semana.*"
    timeout: 15000
- tapOn: "Cierra tu semana.*"
- extendedWaitUntil:
    visible: "Cerrar la semana.*"
    timeout: 15000
- takeScreenshot: pr03-el-cofre
- pressKey: back
- extendedWaitUntil:
    visible: "Caminar.*"
    timeout: 15000
- tapOn: "Caminar.*"
- extendedWaitUntil:
    visible: "Marcar como hecha"
    timeout: 20000
- takeScreenshot: pr03-la-accion-en-entrenar
