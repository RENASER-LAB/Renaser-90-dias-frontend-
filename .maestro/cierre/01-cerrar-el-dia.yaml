# C01 — «Cierra tu día» (spec 017, corregida el 2026-10-30): la fila está SIEMPRE, al final de la lista de hoy y sin hora;
# la hoja pregunta solo por lo que ya llegó a su hora (y por lo que no tiene hora); guardar deja la fila en verde.
# Precondición: una cuenta con el día SIN cerrar y dos acciones de hoy sin cumplir: «Revisar las facturas» (con hora ya
# pasada) y «Llamar a mi mentor» (sin hora). Si el servidor no las da por llegadas (reloj de prueba), el flujo falla a
# propósito: es lo que prueba.
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- scrollUntilVisible:
    element: "Cierra tu día"
    direction: DOWN
    timeout: 60000
- takeScreenshot: C01a-fila-al-final
- tapOn: "Cierra tu día"
- extendedWaitUntil:
    visible: "Guardar mi cierre"
    timeout: 30000
- assertVisible: "¿Qué pasó?"
- assertVisible: "Era a las 20:30 · quedó pendiente"
# Primera tarjeta («Revisar las facturas»)…
- tapOn:
    text: "No me alcanzó el tiempo"
    index: 0
- tapOn:
    text: "Hacerla a otra hora"
    index: 0
# …y segunda («Llamar a mi mentor»), que va debajo de su título.
- scrollUntilVisible:
    element: "Quedó pendiente"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Surgió otra cosa"
    below: "Quedó pendiente"
- tapOn:
    text: "Pedir ayuda"
    below: "Quedó pendiente"
- takeScreenshot: C01b-respondido
- tapOn: "Guardar mi cierre"
- extendedWaitUntil:
    visible: "Día cerrado"
    timeout: 30000
- takeScreenshot: C01c-dia-cerrado
- tapOn: "Listo"
- scrollUntilVisible:
    element: "Día cerrado, .*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: C01d-fila-verde
