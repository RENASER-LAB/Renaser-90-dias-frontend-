# CP01 — «Cierra tu día» en Plan (spec 033; antes estaba en Training, spec 017): la tarjeta está bajo «Acciones que mueven la
# meta», la hoja pregunta solo por lo que ya llegó a su hora (y por lo que no tiene hora), guardar deja la tarjeta en verde y
# «Ver mañana en Plan» lleva a las acciones que Plan muestra de mañana.
# ESCRITO Y SIN CORRER: se corre cuando haya emulador libre, con el backend local (base clonada, nunca producción).
# Precondición: una cuenta con sus objetivos de 90 días ya confirmados (el Mapa de Renacimiento ya no existe: spec 026), el día SIN cerrar
# y dos acciones de hoy sin cumplir: «Revisar las facturas» (con una hora que ya pasó; la que sea) y «Llamar a mi mentor» (sin hora), y NINGUNA
# otra acción de hoy sin cumplir. Si la cuenta trae más (la base del E2E del 02/11 deja tres: 05:00, 10:00 y sin hora), «Guardar mi cierre»
# sigue apagado y el flujo falla por datos, no por la app. Si el servidor no da por llegada la hora (reloj de prueba), el flujo falla a propósito: es lo que prueba.
# Se corre con: .maestro/correr.sh .maestro/cierre-en-plan/01-cerrar-el-dia-desde-plan.yaml
# cuenta: aprendiz
appId: com.renaser.app
---
- runFlow: ../comun/ya-adentro.yaml
- tapOn: "PLAN"
- extendedWaitUntil:
    visible: "Acciones que mueven la meta"
    timeout: 30000
# La tarjeta va DESPUÉS de las acciones (cerrar es lo último que se hace) y no lleva hora.
- scrollUntilVisible:
    element: "Cierra tu día"
    direction: DOWN
    timeout: 60000
- assertVisible: "2 minutos · opcional, no da puntos"
- takeScreenshot: CP01a-tarjeta-en-plan
- tapOn: "Cierra tu día"
- extendedWaitUntil:
    visible: "Guardar mi cierre"
    timeout: 30000
- assertVisible: "¿Qué pasó?"
- assertVisible: "Selecciona lo que más haya influido."
# La hora de la acción es la que sembró la base: se comprueba la forma, no «20:30».
- assertVisible: "Era a las .* · quedó pendiente"
# Primera tarjeta («Revisar las facturas»)… Los chips se ven con ícono y texto corto («Tiempo», «Otra hora», 2026-11-03), pero su nombre
# para el lector de pantalla —lo que Maestro lee como accesibilidad— sigue siendo el texto completo de siempre: se toca por ese.
- tapOn:
    text: "No me alcanzó el tiempo"
    index: 0
- tapOn:
    text: "Hacerla a otra hora"
    index: 0
# …y segunda («Llamar a mi mentor»), que va debajo de su título.
- scrollUntilVisible:
    element: "Quedó pendiente"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Surgió otra cosa"
    below: "Quedó pendiente"
- tapOn:
    text: "Pedir ayuda"
    below: "Quedó pendiente"
- takeScreenshot: CP01b-respondido
- tapOn: "Guardar mi cierre"
- extendedWaitUntil:
    visible: "Día cerrado"
    timeout: 30000
# Ya no dice «Ver mañana en Training»: Training no tiene el cierre.
- assertVisible: "Ver mañana en Plan"
- assertNotVisible: "Ver mañana en Training"
- takeScreenshot: CP01c-dia-cerrado
# «Ver mañana en Plan» solo mueve: cierra la hoja y deja a la vista las acciones que vienen.
- tapOn: "Ver mañana en Plan"
- extendedWaitUntil:
    visible: "Acciones que mueven la meta"
    timeout: 30000
- takeScreenshot: CP01d-acciones-de-manana
- scrollUntilVisible:
    element: "Día cerrado"
    direction: DOWN
    timeout: 60000
- takeScreenshot: CP01e-tarjeta-verde
