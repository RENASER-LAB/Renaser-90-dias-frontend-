# Contesta lo que se ve del DIAGNÓSTICO del dueño (spec 026, `diagnostico-inicial.csv` importado) con la respuesta más corta que
# vale: reconoce cada pregunta por su texto y no depende de cómo se reparten las preguntas en pasos. Lo que ya viene
# precargado (nombre y ciudad, de la solicitud) no se toca. Los textos que se escriben son de una letra: `inputText` tarda unos
# 10 s por letra (ver el README).
# Parámetro opcional: NEGOCIO (por defecto «No\.»): la respuesta a «¿Actualmente tienes un negocio…?».
# Parámetro opcional: META (por defecto «no»): con «si» contesta también las preguntas de la meta medible del BORRADOR SEMBRADO por la V157
# (Relaciones 5 → 8 sobre 10, Cuerpo 9 → 5 «k», Negocio 1 → 2 «S»: un solo carácter cada una). No existen en `diagnostico-inicial.csv`, que es el formulario del dueño tal cual.
appId: com.renaser.app
env:
  NEGOCIO: "No\\."
  META: "no"
---
- runFlow:
    when:
      visible: "¿Cuántos años tienes\\?"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p2"
      - inputText: "34"
      - hideKeyboard
- runFlow:
    when:
      visible: "¿A qué te dedicas actualmente\\?"
    commands:
      - tapOn: "Soy profesional independiente\\."
# La cuadrícula de satisfacción: las siete filas, con el 3.
- runFlow:
    when:
      visible: "¿Qué tan satisfecho\\(a\\) estás.*"
    commands:
      - tapOn: "Mis relaciones personales y familiares: 3"
      - tapOn: "Mi salud y bienestar físico: 3"
      - tapOn: "Mi capacidad para gestionar mis emociones: 3"
      - tapOn: "Mi disciplina para cumplir lo que me propongo: 3"
      - tapOn: "Mi situación económica personal: 3"
      - tapOn: "Mis resultados profesionales o empresariales: 3"
      - tapOn: "El tiempo disponible para disfrutar mi vida: 3"
- runFlow:
    when:
      visible: "En tus relaciones personales, familiares o profesionales.*"
    commands:
      - tapOn: "Me cuesta expresar lo que siento o necesito\\."
- runFlow:
    when:
      visible: "Durante los últimos siete días, ¿cuántas horas dormiste.*"
    commands:
      - tapOn: "Menos de 5 horas\\."
- runFlow:
    when:
      visible: "Durante los últimos siete días, ¿cuántos días realizaste.*"
    commands:
      - tapOn: "Ningún día\\."
- runFlow:
    when:
      visible: "¿Qué aspecto está afectando más tu salud.*"
    commands:
      - tapOn: "Falta de descanso\\."
- runFlow:
    when:
      visible: "¿Cuál es tu ingreso personal mensual.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p10"
      - inputText: "0"
      - hideKeyboard
- runFlow:
    when:
      visible: "¿Qué situación describe mejor tu realidad económica.*"
    commands:
      - tapOn: "Actualmente no genero ingresos\\."
- runFlow:
    when:
      visible: "¿Cuántas horas dedicas semanalmente.*"
    commands:
      - tapOn: "Actualmente no trabajo\\."
- runFlow:
    when:
      visible: "¿Actualmente tienes un negocio.*"
    commands:
      - tapOn: "${NEGOCIO}"
# Las del negocio son opcionales: con «Sí.» solo se contesta la primera.
- runFlow:
    when:
      visible: "¿A qué se dedica tu negocio\\?"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p13a"
      - inputText: "x"
      - hideKeyboard
# «Tu mente…» (p14) es opcional: se deja. La 15 es un párrafo obligatorio.
- runFlow:
    when:
      visible: "Piensa en una situación real de los últimos 30 días.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p15"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "RELACIONES \\|.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p16"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "SALUD Y BIENESTAR \\|.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p17"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "RIQUEZA Y NEGOCIOS \\|.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p18"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "De las tres áreas anteriores.*"
    commands:
      - tapOn: "Riqueza, profesión o negocios\\."
- runFlow:
    when:
      visible: "Imagina que han transcurrido 12 meses.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p20"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "¿Qué primera acción concreta.*"
    commands:
      - tapOn:
          id: "pregunta-(diag_)?p21"
      - inputText: "x"
      - hideKeyboard
- runFlow:
    when:
      visible: "¿Cuánto tiempo puedes dedicar semanalmente.*"
    commands:
      - tapOn: "Menos de 2 horas\\."
- runFlow:
    when:
      visible: "Declaración de responsabilidad y consentimiento"
    commands:
      - tapOn: "He leído y acepto la declaración de responsabilidad y consentimiento\\."
# La meta medible (spec 026, V157): opcionales, así que solo se contestan con META=si. Cada respuesta es de un carácter por lo lento de `inputText`.
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "RELACIONES · Del 1 al 10, ¿cómo calificas hoy.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p16c"
      - inputText: "5"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "RELACIONES · ¿A qué número del 1 al 10 quieres llevarla.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p16d"
      - inputText: "8"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "SALUD Y BIENESTAR · ¿En qué unidad mides.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p17c"
      - inputText: "k"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "SALUD Y BIENESTAR · ¿Desde qué número partes hoy.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p17d"
      - inputText: "9"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "SALUD Y BIENESTAR · ¿A qué número quieres llegar.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p17e"
      - inputText: "5"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "RIQUEZA Y NEGOCIOS · ¿En qué unidad mides.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p18c"
      - inputText: "S"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "RIQUEZA Y NEGOCIOS · ¿Desde qué número partes hoy.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p18d"
      - inputText: "1"
      - hideKeyboard
- runFlow:
    when:
      true: ${META == 'si'}
      visible: "RIQUEZA Y NEGOCIOS · ¿A qué número quieres llegar.*"
    commands:
      - tapOn:
          id: "pregunta-diag_p18e"
      - inputText: "2"
      - hideKeyboard
