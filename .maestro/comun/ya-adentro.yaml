# Punto de partida de todo flujo: la sesión ya la abrió `correr.sh` (por adb; ver el README). Acá se despejan las capas
# que aparecen al entrar (permiso de avisos, guía de SER, aviso de desarrollo) y se confirma que se ve la barra de
# pestañas. La guía de SER puede llegar unos segundos después del permiso: por eso se despeja hasta tres veces.
appId: com.renaser.app
---
# El formulario del Código Renaser de la hora en punto tapa todo: se registra antes de seguir (llenar-formulario-radar). Y si la barra de pestañas quedó
# escondida por el scroll del flujo anterior, un deslizamiento hacia abajo la devuelve (spec 058: lo que hacía fallar este paso en cadena).
- runFlow:
    when:
      visible: ".*Innegociable.*"
    commands:
      - runFlow: llenar-formulario-radar.yaml
- swipe:
    start: 50%,30%
    end: 50%,65%
- runFlow: despejar-capas.yaml
- repeat:
    while:
      notVisible: "ENTRENAR"
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "ENTRENAR"
          timeout: 5000
          optional: true
      - runFlow: despejar-capas.yaml
- extendedWaitUntil:
    visible: "ENTRENAR"
    timeout: 30000
