# «Siempre | Por semana» (spec 028, decisión del dueño 028-1 A; 2026-11-02: nombres nuevos y sin párrafos de ayuda): el editor de
# Planificar ofrece «Siempre» (por defecto, lo de siempre) y «Por semana». En «Por semana» se ve «Semana del … al …», todos los días que
# faltan vienen marcados, un cambio de aviso vale solo para esos días, el día cambiado lleva el punto (su etiqueta dice «cambiado solo
# esta semana») y «Volver al plan de siempre» lo devuelve. El plan de siempre no se toca.
# ESCRITO Y SIN CORRER. Precondición: backend con la spec 028 (V130 y V131); aprendiz con el Día 1 elegido; un hábito de la dimensión
# `DIMENSION` SIN cambios por semana (por defecto «Escritura libre nocturna» de «Mente», que existe en la base de prueba de Ana;
# otro: `-e HABITO="Jugo verde" -e DIMENSION=Cuerpo`). Los avisos que se van solos a los 3 s («Queda con aviso nuevo…») NO se esperan: se
# comprueba el estado que queda guardado (el punto del día y «Volver al plan de siempre»).
# cuenta: aprendiz
appId: com.renaser.app
env:
  HABITO: "Escritura libre nocturna"
  DIMENSION: "Mente"
---
- runFlow: ../comun/ya-adentro.yaml
- runFlow: ../comun/abrir-training.yaml
- tapOn: "Tus prácticas: planificar"
- extendedWaitUntil:
    visible: "Tus prácticas"
    timeout: 15000
- tapOn: "${DIMENSION}: .* de .* cumplidos hoy"
- extendedWaitUntil:
    visible: "Toca uno para cambiarle la hora\\."
    timeout: 15000
- tapOn: "${HABITO}, .*"
- extendedWaitUntil:
    visible: "Guardar .*"
    timeout: 15000
# Por defecto, «Siempre»: la hoja de siempre, sin párrafos de ayuda.
- assertVisible: "Siempre"
- assertVisible: "Por semana"
- assertVisible: "Todos los días"
- assertNotVisible: "Toca un día para darle.*"
- assertNotVisible: "Todas las semanas"
- takeScreenshot: S01a-siempre-por-defecto
# «Por semana»: la semana en curso, los días que faltan marcados; el plan de siempre no cambia.
- tapOn: "El cambio vale solo para la semana que elijas"
- extendedWaitUntil:
    visible: "Semana del .* al .*"
    timeout: 15000
- assertVisible: "Guardar .* · semana .*"
- assertNotVisible: "Tu plan de siempre no cambia.*"
- assertNotVisible: "Toda esta semana"
- takeScreenshot: S01b-por-semana
# Un aviso «A la hora» solo en esta semana.
- tapOn: "A la hora exacta"
- assertVisible: "Guardar aviso · .*semana .*"
- tapOn: "Guardar aviso · .*semana .*"
# El mensaje de «Queda con aviso nuevo…» dura ~3 s y Maestro puede llegar tarde: no se espera. Lo que importa es lo que queda guardado.
- extendedWaitUntil:
    visible: "Queda .* de la semana .*"
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible: "Volver al plan de siempre los .*"
    timeout: 20000
- assertVisible: ".*cambiado solo esta semana.*"
- takeScreenshot: S01c-cambiado-por-semana
# El plan de siempre sigue intacto: «Siempre» no tiene el cambio.
- tapOn: "El cambio vale siempre, para todas las semanas"
- extendedWaitUntil:
    visible: "Todos los días"
    timeout: 15000
- assertNotVisible: ".*cambiado solo esta semana.*"
- takeScreenshot: S01d-siempre-sin-cambio
# Volver al plan de siempre.
- tapOn: "El cambio vale solo para la semana que elijas"
- extendedWaitUntil:
    visible: "Volver al plan de siempre los .*"
    timeout: 15000
- tapOn: "Volver al plan de siempre los .*"
- extendedWaitUntil:
    visible: "Vuelve al plan de siempre los .*"
    timeout: 20000
    optional: true
# El estado que queda: ya no hay día cambiado ni el enlace para volver.
- extendedWaitUntil:
    notVisible: "Volver al plan de siempre los .*"
    timeout: 20000
- assertNotVisible: ".*cambiado solo esta semana.*"
- takeScreenshot: S01e-de-vuelta-al-plan-de-siempre
- back
- back
- back
