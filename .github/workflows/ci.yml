# Integracion continua del frontend: el mismo `npm run verificar` que se corre en local (tipos, Jest y reglas de código).
#
# Deliberadamente corto. NO corre el E2E de Playwright ni el smoke nativo de Maestro: los dos
# necesitan un backend de pruebas levantado y siete pares de credenciales que viven fuera de Git
# (`specs/003-admin-alquimista/e2e.md` §8). Un CI que necesita secretos que no existen es un CI
# que nace rojo y que todo el mundo aprende a ignorar. Cuando exista un entorno de pruebas
# desplegado, el E2E entra como workflow aparte, no metido acá.
#
# Tampoco construye el bundle web: eso lo hace Vercel en cada push por su cuenta, y duplicarlo acá
# solo agrega minutos sin agregar informacion.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    # Tres partes en paralelo (2026-11-18): el Jest completo corría en un solo proceso y era el paso más lento. Cada parte
    # corre tipos y reglas igual que antes, y su tercio de Jest con `--shard`; sigue en un proceso por parte (las pruebas de
    # carrera son inestables con varios procesos).
    name: Tipos y pruebas (parte ${{ matrix.parte }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      # Node 20 LTS. La maquina de desarrollo corre 18.20.4 (fuera de soporte desde abril de 2025);
      # si alguna vez algo pasa acá y falla localmente, o al reves, esta es la primera diferencia
      # que hay que mirar.
      - name: Instalar Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lock y falla si el lock y
      # el package.json no coinciden. Esa comprobacion no es un detalle — el 2026-09-15 el
      # typecheck estaba roto en la rama porque `@expo-google-fonts/fraunces` estaba declarado en
      # los dos archivos y nunca se habia instalado, y nadie se entero hasta que alguien miro.
      - name: Instalar dependencias
        run: npm ci

      # Lo mismo que se corre en local antes de decir «terminado»: parches de
      # postinstall, tipos y Jest completo, con las reglas de código adentro. `--ci` hace fallar los snapshots nuevos
      # en vez de escribirlos y marca como «no aplica» la trazabilidad de specs, que corre el CI del backend contra
      # esta rama (trazabilidad.yml). Un solo camino: si cambia lo que se verifica, cambia en scripts/verificar.mjs.
      - name: Verificar (tipos, pruebas y reglas de código)
        run: npm run verificar -- --ci --shard=${{ matrix.parte }}/3
